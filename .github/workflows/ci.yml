name: ROS 2 Jazzy
on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]
  workflow_dispatch:

jobs:
  build-and-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply pinned MuJoCo compatibility patch
        run: ./tools/prepare_jazzy
      - name: Build Ubuntu 24.04 / Jazzy environment
        run: docker build --build-arg BUILD_JOBS=2 -t multipanda-jazzy:ci -f tools/Dockerfile tools
      - name: Compile and verify mock hardware and MuJoCo
        run: |
          docker run --name multipanda-jazzy-ci \
            -v "$GITHUB_WORKSPACE:/home/developer/multipanda_ws/src:ro" \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 multipanda-jazzy:ci bash -c '
              set -e
              ./src/tools/build_jazzy
              source install/setup.bash
              colcon test --packages-select franka_description --ctest-args -R urdf_tests
              colcon test-result --verbose
              python3 src/tools/verify_jazzy.py
            '
      - name: Collect build and simulation logs
        if: always()
        run: |
          mkdir -p ci-results
          docker cp multipanda-jazzy-ci:/home/developer/multipanda_ws/log ci-results/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jazzy-validation
          path: ci-results/
