controller_names:
  - dual_panda_arm_controller
  - mj_left_gripper_sim_node
  - mj_right_gripper_sim_node

dual_panda_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: false
  joints:
    - mj_left_joint1
    - mj_left_joint2
    - mj_left_joint3
    - mj_left_joint4
    - mj_left_joint5
    - mj_left_joint6
    - mj_left_joint7
    - mj_right_joint1
    - mj_right_joint2
    - mj_right_joint3
    - mj_right_joint4
    - mj_right_joint5
    - mj_right_joint6
    - mj_right_joint7

mj_left_gripper_sim_node:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - mj_left_finger_joint1
      - mj_left_finger_joint2

mj_right_gripper_sim_node:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - mj_right_finger_joint1
      - mj_right_finger_joint2
