controller_names:
  - garmi_arm_controller
  - left_gripper_sim_node
  - right_gripper_sim_node

garmi_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: false
  joints:
    - left_joint1
    - left_joint2
    - left_joint3
    - left_joint4
    - left_joint5
    - left_joint6
    - left_joint7
    - right_joint1
    - right_joint2
    - right_joint3
    - right_joint4
    - right_joint5
    - right_joint6
    - right_joint7

left_gripper_sim_node:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - left_finger_joint1
      - left_finger_joint2

right_gripper_sim_node:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - right_finger_joint1
      - right_finger_joint2
